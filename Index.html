/* ================= Schedule (ตารางงาน) ================= */
function renderSched(){run('apiSchedule').then(function(list){
  var emps=STATE.employees,map={};list.forEach(function(s){map[s.employee_id+'|'+s.weekday]=s;});
  var empOpts=emps.map(function(e){return '<option value="'+esc(e.employee_id)+'">'+esc(e.employee_id+' · '+e.employee_name)+'</option>';}).join('');
  var wdOpts=WD.map(function(d,i){return '<option value="'+i+'">'+d+'</option>';}).join('');
  var h='<div class="card"><h2 class="sec">'+si('clock')+'กำหนดกะการทำงาน</h2><div class="toolbar" style="margin-top:14px">'+
    '<div class="field grow"><label>พนักงาน</label><select id="scemp">'+(empOpts||'<option>— ยังไม่มีพนักงาน —</option>')+'</select></div>'+
    '<div class="field"><label>วัน</label><select id="scwd">'+wdOpts+'</select></div>'+
    '<div class="field"><label>เข้า</label><input id="scin" type="time"></div>'+
    '<div class="field"><label>ออก</label><input id="scout" type="time"></div>'+
    '<div class="field grow"><label>หมายเหตุ</label><input id="scnote" placeholder="เช่น กะเช้า / กะบ่าย"></div>'+
    '<button class="btn primary" onclick="saveSched()">บันทึกกะ</button></div>'+
    '<div class="muted" style="font-size:12px">คลิกช่องในตารางด้านล่างเพื่อเลือกพนักงาน+วันอย่างรวดเร็ว · เว้นเวลาว่างแล้วกดบันทึก = ลบกะวันนั้น</div></div>';
  h+='<div class="card" style="margin-top:18px"><h2 class="sec">'+si('cal')+'ตารางประจำสัปดาห์</h2><div class="tablewrap" style="margin-top:10px">';
  if(!emps.length)h+='<div class="empty">เพิ่มพนักงานก่อนจึงจะจัดตารางได้</div>';
  else{
    h+='<table><thead><tr><th>พนักงาน</th>'+WD.map(function(d){return '<th style="text-align:center">'+d+'</th>';}).join('')+'</tr></thead><tbody>';
    emps.forEach(function(e){h+='<tr><td style="white-space:nowrap"><span class="av-s">'+esc(initials(e.employee_name))+'</span>'+esc(e.employee_name)+'</td>';
      for(var i=0;i<7;i++){var s=map[e.employee_id+'|'+i];
        var cell=(s&&(s.shift_start||s.shift_end))?'<span class="chip ok" title="'+esc(s.note||'')+'">'+esc(s.shift_start||'')+'–'+esc(s.shift_end||'')+'</span>':'<span class="muted">–</span>';
        h+='<td style="text-align:center;cursor:pointer" onclick="pickSched(\''+esc(e.employee_id)+'\','+i+')">'+cell+'</td>';}
      h+='</tr>';});
    h+='</tbody></table>';}
  setContent(h+'</div></div>');
}).catch(err);}
function pickSched(id,wd){if($('scemp'))$('scemp').value=id;if($('scwd'))$('scwd').value=wd;window.scrollTo(0,0);if($('scin'))$('scin').focus();}
function saveSched(){var s={employee_id:val('scemp'),weekday:val('scwd'),shift_start:val('scin'),shift_end:val('scout'),note:val('scnote')};if(!s.employee_id){toast('เลือกพนักงาน',true);return;}
  if(!s.shift_start&&!s.shift_end){run('apiDeleteSchedule',s.employee_id,s.weekday).then(function(){toast('ล้างกะแล้ว');renderSched();}).catch(err);return;}
  run('apiSaveSchedule',s).then(function(){toast('บันทึกกะแล้ว');renderSched();}).catch(err);}

/* ================= ใบลงเวลา PAY-TS (พิมพ์แจกรายคน) =================
   เดิมเป็นการ์ด TS-01 (รูปพื้นหลัง + ข้อความวางทับ) → เปลี่ยนเป็นใบลงเวลาดีไซน์ใหม่ที่วาดด้วย HTML/CSS ทั้งใบ
   ดีไซน์ต้นแบบ (ผ่านตรวจแล้ว ห้ามเปลี่ยน): timesheet/timesheet-form.html → renderTimesheet() ด้านล่างพอร์ตมาจากไฟล์นั้น
   ความสามารถเดิมคงไว้ครบ: เลือกพนักงาน (หมวดรหัส/ช่วงรหัส/ทั้งหมด) · พิมพ์ชื่อ-รหัส-งวดให้ · พิมพ์ใบเดียว/หลายใบ
   + ดาวน์โหลด PDF จริงฝั่ง browser (html2canvas + jsPDF แผ่นละ 1 หน้า A4) แทนการสั่ง "บันทึกเป็น PDF" ในหน้าต่างพิมพ์
   (บอทอ่านตัวพิมพ์แม่นกว่าลายมือมาก → ผูกแถวเข้ากับพนักงานได้ถูกคนขึ้น)
   ช่อง "ตำแหน่ง" ไม่มีในดีไซน์ใหม่ (หัวกระดาษมีแค่ ชื่อ-สกุล / รหัส 8 ช่อง / งวดวันที่ / ลายมือชื่อ) */

function renderCard(){
  var t=STATE.today,first=t.slice(0,8)+'01';
  setPageStyle('@page{size:A4 portrait;margin:0}');   // ใบ PAY-TS สูง 297mm พอดีหน้า → ขอบกระดาษ 0 (ขอบอยู่ในตัวใบแล้ว)
  tsInstallCss();
  var act=STATE.employees.filter(function(e){return (e.status||'ทำงาน')==='ทำงาน';});
  var list=act.length?act:STATE.employees;
  var h='<div class="card"><h2 class="sec">'+si('printer')+'ออกใบลงเวลา <span class="muted" style="font-weight:400;font-size:12px">(PAY-TS · พิมพ์ชื่อ-รหัส-งวดไว้ให้แล้ว)</span></h2>'+
    '<div class="toolbar" style="margin-top:14px">'+
    '<div class="field"><label>งวดวันที่</label><input id="cdf" type="date" value="'+first+'" onchange="drawCards()"></div>'+
    '<div class="field"><label>ถึงวันที่</label><input id="cdt" type="date" value="'+t+'" onchange="drawCards()"></div>'+
    '<button class="btn primary" onclick="printOneCard()">'+ic('printer',15)+' พิมพ์ใบเดียว</button>'+
    '<button class="btn green" onclick="printSelectedCards()">'+ic('printer',15)+' พิมพ์หลายใบ</button>'+
    '<button class="btn" id="cdpdf" onclick="exportCardsPdf()">'+ic('down',15)+' ดาวน์โหลด PDF</button></div>'+
    '<div class="tsopt"><button type="button" class="cdtog on" id="cdfill" onclick="this.classList.toggle(\'on\');drawCards()">'+
      '<span class="tk">✓</span>พิมพ์วันที่ของงวดลงตารางให้ (พนักงานกรอกแค่เวลา)</button>'+
      // จำนวนแถวต่อใบ: ปุ่ม − [ตัวเลข] + (ไม่ใช้ select ของเบราว์เซอร์) · จำค่าไว้ในเครื่อง (localStorage TS_ROWS)
      '<div class="tsrows" role="group" aria-label="จำนวนแถวต่อใบ"><span class="tsr-lab">จำนวนแถวต่อใบ</span>'+
        '<button type="button" class="tsr-btn" id="tsrMinus" onclick="tsRowsStep(-1)" aria-label="ลดจำนวนแถว">−</button>'+
        '<input id="cdrows" class="tsr-val" inputmode="numeric" maxlength="2" autocomplete="off" value="'+tsRowsGet()+'" onchange="tsRowsSet(this.value)" onkeydown="if(event.key===\'Enter\'){event.preventDefault();this.blur();}">'+
        '<button type="button" class="tsr-btn" id="tsrPlus" onclick="tsRowsStep(1)" aria-label="เพิ่มจำนวนแถว">+</button>'+
        '<button type="button" class="btn tsr-auto" onclick="tsRowsAuto()">'+ic('cal',16)+' ตามจำนวนวันในงวด</button>'+
        '<span class="tsr-hint">1–16 แถว</span></div>'+
      '<div class="tsz" role="group" aria-label="ขนาดใบ"><span class="tsr-lab">ขนาดใบ</span>'+
        '<button type="button" class="tsz-b" data-v="half" onclick="tsSizeSet(\'half\')">กะทัดรัด · หลายใบ/หน้า</button>'+
        '<button type="button" class="tsz-b" data-v="full" onclick="tsSizeSet(\'full\')">เต็มหน้า · 1 ใบ/หน้า</button></div></div>'+
    '<div style="margin-top:14px"><label style="font-size:12px;color:var(--muted);display:block;margin-bottom:8px">เลือกพนักงาน '+
    '<button class="btn sm" style="margin-left:6px" onclick="pickAll(1)">เลือกทั้งหมด</button> '+
    '<button class="btn sm" onclick="pickAll(0)">ไม่เลือก</button> '+
    // กรองตามตัวนำหน้ารหัส (EMP / PT …) — รายชื่อยาวเป็นร้อยคน เลือกทีละหมวดจะหาง่ายกว่า
    '<select id="cdgrp" onchange="filterPick()" style="margin-left:10px;width:auto;display:inline-block;padding:4px 8px;font-size:12px">'+
    cardGroupOptions(list)+'</select> '+
    // เลือกเป็นช่วงรหัสเอง เช่น EMP001 ถึง EMP080 — เร็วกว่าไล่ติ๊กทีละคนตอนมีเป็นร้อย
    '<span style="margin-left:10px;white-space:nowrap">'+
    '<input id="cdr1" placeholder="EMP001" onkeydown="if(event.key===\'Enter\')pickRange()" style="width:92px;display:inline-block;padding:4px 8px;font-size:12px">'+
    '<span class="muted" style="margin:0 4px">ถึง</span>'+
    '<input id="cdr2" placeholder="EMP080" onkeydown="if(event.key===\'Enter\')pickRange()" style="width:92px;display:inline-block;padding:4px 8px;font-size:12px">'+
    '<button class="btn sm" style="margin-left:6px" onclick="pickRange()">เลือกช่วงนี้</button></span> '+
    '<span id="cdcount" class="muted" style="font-size:12px"></span></label>';
  if(!list.length)h+='<div class="empty">ยังไม่มีพนักงาน — เพิ่มที่เมนู “พนักงาน” ก่อน</div>';
  else h+='<div id="cdpickwrap" style="display:flex;flex-wrap:wrap;gap:8px">'+list.map(function(e,i){
    return '<button type="button" class="cdpick on" data-i="'+i+'" data-grp="'+esc(codeGroup(e.employee_id))+'" onclick="togglePick(this)">'+
      '<span class="tk">✓</span>'+esc(e.employee_name||e.employee_id)+'</button>';}).join('')+'</div>';
  h+='</div><div class="muted" style="font-size:12px;margin-top:12px">พิมพ์ลง A4 (กะทัดรัด = เรียงหลายใบต่อหน้าตามความสูงใบ ตัดตามเส้นประ · เต็มหน้า = 1 ใบ/หน้า · ใบละไม่เกิน 16 แถว งวดยาวกว่าจำนวนแถวแตกเป็นหลายใบให้เอง) → แจกพนักงาน → กรอกเวลาด้วยปากกา → ถ่ายรูปส่งเข้า LINE'+(FEATURE_TS_UPLOAD?' หรืออัปที่เมนู “อัปรูปใบลงเวลา”':'')+' → เข้าชีตอัตโนมัติ</div></div>'+
    '<div id="printArea" style="margin-top:18px"></div>';
  setContent(h);
  CARD_LIST=list;tsRowsPaint();tsSizePaint();drawCards();
}
var CARD_LIST=[];
// ตัวนำหน้ารหัสพนักงาน: EMP001 → EMP, PT004 → PT (ไม่มีตัวอักษรนำ = "อื่นๆ")
function codeGroup(id){var m=String(id||'').trim().match(/^[A-Za-z]+/);return m?m[0].toUpperCase():'อื่นๆ';}
function cardGroupOptions(list){
  var seen={},order=[];
  (list||[]).forEach(function(e){var g=codeGroup(e.employee_id);if(!seen[g]){seen[g]=0;order.push(g);}seen[g]++;});
  order.sort();
  return '<option value="">ทุกหมวดรหัส ('+(list||[]).length+')</option>'+
    order.map(function(g){return '<option value="'+esc(g)+'">'+esc(g)+' ('+seen[g]+')</option>';}).join('');
}
// เลือกหมวด = ซ่อน/แสดงปุ่มเท่านั้น ไม่ไปปลดที่ติ๊กไว้ของหมวดอื่น
// แต่การพิมพ์จะนับเฉพาะปุ่มที่ "ติ๊กอยู่และมองเห็น" เพื่อไม่ให้พิมพ์คนที่ถูกซ่อน
function filterPick(){
  var g=(document.getElementById('cdgrp')||{}).value||'';
  var b=document.querySelectorAll('.cdpick');
  for(var i=0;i<b.length;i++)b[i].style.display=(!g||b[i].getAttribute('data-grp')===g)?'':'none';
  drawCards();
}
function pickCountLabel(){
  var el=document.getElementById('cdcount');if(!el)return;
  var shown=visibleCardButtons().length,on=selectedCardButtons().length;
  el.textContent='· เลือกอยู่ '+on+' จาก '+shown+' คน';
}
function visibleCardButtons(){
  return Array.prototype.slice.call(document.querySelectorAll('.cdpick')).filter(function(b){return b.style.display!=='none';});
}
function togglePick(b){b.classList.toggle('on');drawCards();}
function pickAll(on){visibleCardButtons().forEach(function(b){b.classList.toggle('on',!!on);});drawCards();}

// แยกรหัสเป็น {grp:'EMP', num:1} — กรอกเลขล้วน ("1", "80") ก็ได้ จะใช้หมวดที่กรองอยู่หรือหมวดของอีกช่อง
function parseCode(v,fallbackGrp){
  var s=String(v||'').trim().toUpperCase().replace(/\s+/g,'');
  if(!s)return null;
  var m=s.match(/^([A-Z]*)(\d+)$/);
  if(!m)return null;
  return {grp:m[1]||String(fallbackGrp||'').toUpperCase(),num:parseInt(m[2],10)};
}
// เลือกพนักงานเป็นช่วงรหัส เช่น EMP001 – EMP080 (ติ๊กเฉพาะในช่วง คนนอกช่วงถูกปลด)
function pickRange(){
  var g=(document.getElementById('cdgrp')||{}).value||'';
  var raw1=val('cdr1'),raw2=val('cdr2');
  var g1=(parseCode(raw1,'')||{}).grp||'',g2=(parseCode(raw2,'')||{}).grp||'';
  var a=parseCode(raw1,g||g2),b=parseCode(raw2,g||g1);
  if(!a||!b){toast('กรอกช่วงรหัสให้ครบ เช่น EMP001 ถึง EMP080',true);return;}
  if(a.grp!==b.grp){toast('ช่วงรหัสต้องเป็นหมวดเดียวกัน ('+a.grp+' กับ '+b.grp+')',true);return;}
  if(!a.grp){toast('ระบุหมวดรหัสด้วย เช่น EMP001',true);return;}
  if(a.num>b.num){var t2=a.num;a.num=b.num;b.num=t2;}
  // สลับตัวกรองหมวดให้ตรงกับช่วง ไม่งั้นคนที่เลือกอาจถูกซ่อนอยู่จนไม่ถูกพิมพ์
  var sel=document.getElementById('cdgrp');
  if(sel){var has=Array.prototype.some.call(sel.options,function(o){return o.value===a.grp;});sel.value=has?a.grp:'';}
  var n=0;
  Array.prototype.slice.call(document.querySelectorAll('.cdpick')).forEach(function(btn){
    var e=CARD_LIST[Number(btn.getAttribute('data-i'))]||{};
    var c=parseCode(e.employee_id,'');
    var inRange=!!c&&c.grp===a.grp&&c.num>=a.num&&c.num<=b.num;
    btn.classList.toggle('on',inRange);
    if(inRange)n++;
  });
  filterPick();
  toast(n?('เลือก '+a.grp+pad3(a.num)+' – '+a.grp+pad3(b.num)+' แล้ว '+n+' คน'):'ไม่พบพนักงานในช่วงนี้',!n);
}
function pad3(n){return ('00'+n).slice(-3);}

// คืนปุ่มพนักงานที่ถูกเลือกอยู่ในขณะนี้ (เฉพาะที่แสดงอยู่ในหมวดที่กรองไว้)
function selectedCardButtons(){return visibleCardButtons().filter(function(b){return b.classList.contains('on');});}

// พิมพ์เพียง 1 ใบ: ต้องเลือกพนักงานไว้เพียงคนเดียว
function printOneCard(){
  var picked=selectedCardButtons();
  if(!picked.length){toast('กรุณาเลือกพนักงาน 1 คนก่อนพิมพ์',true);return;}
  if(picked.length!==1){toast('พิมพ์ใบเดียวต้องเลือกพนักงานเพียง 1 คน',true);return;}
  drawCards();
  setTimeout(function(){window.print();},80);
}

// พิมพ์พนักงานที่เลือกทั้งหมด — จัดลง A4 จำนวน 2 ใบต่อหน้า
function printSelectedCards(){
  var picked=selectedCardButtons();
  if(!picked.length){toast('กรุณาเลือกพนักงานอย่างน้อย 1 คน',true);return;}
  drawCards();
  setTimeout(function(){window.print();},80);
}

// ดาวน์โหลด PDF จริง (ไม่ผ่านหน้าต่างพิมพ์) — วาดใบของทุกคนที่เลือกลงกล่องนอกจอ แล้วจับภาพทีละแผ่น → A4 แนวตั้ง 1 แผ่น/หน้า
// ใช้ html2canvas + jsPDF ตัวเดียวกับสลิป/ทะเบียนเงินได้ (loadPdfLibs) — สีและเส้นตรงหน้าจอ 100%
function exportCardsPdf(){
  var picked=pickedCardEmployees();
  if(!picked.length){toast('กรุณาเลือกพนักงานอย่างน้อย 1 คน',true);return;}
  var from=val('cdf')||'',to=val('cdt')||'';
  var btn=$('cdpdf');if(btn)btn.disabled=true;
  toast('กำลังสร้าง PDF ใบลงเวลา…');
  var name='TimeSheet_PAY-TS_'+(picked.length===1?(picked[0].employee_id||'')+'_':'')+(from||'blank')+(to?'_'+to:'')+'.pdf';
  tsPdfBlob(picked.map(function(e){return tsOpts(e,from,to);}),name).then(function(r){
    dl(r.base64,r.name,'application/pdf');toast('ดาวน์โหลด PDF แล้ว ('+r.pages+' หน้า A4)');
  }).catch(function(e){toast((e&&e.message)||'สร้าง PDF ไม่สำเร็จ',true);})
    .then(function(){var b=$('cdpdf');if(b)b.disabled=false;});
}

// พนักงานที่เลือกอยู่ (เฉพาะที่มองเห็นในหมวดที่กรองไว้) → ข้อมูลพนักงาน
function pickedCardEmployees(){return selectedCardButtons().map(function(x){return CARD_LIST[Number(x.getAttribute('data-i'))];});}
function tsFillOn(){var b=$('cdfill');return !!(b&&b.classList.contains('on'));}
function tsOpts(e,from,to){return {name:e.employee_name||'',id:e.employee_id||'',from:from,to:to,prefillDates:tsFillOn(),rows:tsRowsVal(),size:tsSizeGet(),logo:STATE.logo||''};}
/* ---- ขนาดใบ: 'half' = ครึ่งหน้า A4 2 ใบ/หน้า (ค่าเริ่มต้น ประหยัดกระดาษ) · 'full' = เต็มหน้า 1 ใบ/หน้า (ดีไซน์ mockup) ---- */
function tsSizeGet(){var v='';try{v=localStorage.getItem('TS_SIZE')||'';}catch(e){}return v==='full'?'full':'half';}
function tsSizeSet(v){v=v==='full'?'full':'half';try{localStorage.setItem('TS_SIZE',v);}catch(e){}tsSizePaint();drawCards();}
function tsSizePaint(){var v=tsSizeGet(),b=document.querySelectorAll('.tsz-b');
  for(var i=0;i<b.length;i++){var on=b[i].getAttribute('data-v')===v;b[i].classList.toggle('on',on);b[i].setAttribute('aria-pressed',on?'true':'false');}}
/* ---- จำนวนแถวต่อใบ (1–16) — ความสูงแถว/ขนาดช่องตัวเลขคงเดิมทุกกรณี (ช่องต้องเท่าเดิมให้เขียนและให้ AI อ่าน)
   แถวน้อยลง = ตารางสั้นลง ท้ายกระดาษ (PAY-TS/หัวหน้างานตรวจ/สี่เหลี่ยมดำ) ยังอยู่ขอบล่าง A4 เหมือนเดิม ---- */
var TS_ROWS_MAX=16;
function tsRowsGet(){var n=NaN;try{n=parseInt(localStorage.getItem('TS_ROWS'),10);}catch(e){}return (n>=1&&n<=TS_ROWS_MAX)?n:TS_ROWS_MAX;}
function tsRowsVal(){var e=$('cdrows'),n=e?parseInt(e.value,10):NaN;return (n>=1&&n<=TS_ROWS_MAX)?n:tsRowsGet();}
function tsRowsPaint(){var n=tsRowsVal(),a=$('tsrMinus'),b=$('tsrPlus');if(a)a.disabled=n<=1;if(b)b.disabled=n>=TS_ROWS_MAX;}
function tsRowsSet(v){var n=parseInt(v,10);if(!(n>=1))n=1;if(n>TS_ROWS_MAX)n=TS_ROWS_MAX;
  var e=$('cdrows');if(e)e.value=n;try{localStorage.setItem('TS_ROWS',String(n));}catch(err){}
  tsRowsPaint();drawCards();}
function tsRowsStep(d){tsRowsSet(tsRowsVal()+d);}
// ปุ่มลัด: ตั้งแถว = จำนวนวันในงวด (เกิน 16 = 16 แล้วแตกแผ่นเองแบบเดิม)
function tsRowsAuto(){
  var a=String(val('cdf')).match(/^(\d{4})-(\d{2})-(\d{2})$/),b=String(val('cdt')).match(/^(\d{4})-(\d{2})-(\d{2})$/);
  if(!a||!b){toast('เลือกงวดวันที่ให้ครบก่อน',true);return;}
  var d=Math.round((Date.UTC(+b[1],+b[2]-1,+b[3])-Date.UTC(+a[1],+a[2]-1,+a[3]))/86400000)+1;
  if(d<1){toast('“ถึงวันที่” ต้องไม่ก่อน “งวดวันที่”',true);return;}
  tsRowsSet(Math.min(TS_ROWS_MAX,d));
  toast(d>TS_ROWS_MAX?('งวดนี้มี '+d+' วัน — ตั้ง 16 แถว แล้วแตกเป็นหลายแผ่นให้เอง'):('ตั้ง '+d+' แถว ตามจำนวนวันในงวด'));
}

function drawCards(){
  var area=$('printArea');if(!area)return;
  var from=val('cdf'),to=val('cdt');
  var picked=pickedCardEmployees();
  pickCountLabel();
  if(!picked.length){area.innerHTML='<div class="card"><div class="empty">เลือกพนักงานอย่างน้อย 1 คนเพื่อดูตัวอย่างใบลงเวลา</div></div>';return;}

  // เตือนก่อนพิมพ์ (ไม่พิมพ์ออกไป): ช่วงวันที่กลับด้าน = ใบจะไม่มีงวด · รหัสยาวเกิน 8 ช่อง = ตัวท้ายหาย
  var notes=[];
  if(from&&to&&to<from)notes.push('“ถึงวันที่” อยู่ก่อน “งวดวันที่” — ใบจะพิมพ์ช่องงวดว่างไว้ให้เขียนเอง');
  var longId=picked.filter(function(e){return String(e.employee_id||'').trim().length>8;});
  if(longId.length)notes.push('รหัสพนักงานยาวเกิน 8 ตัว (ช่องรหัสบนใบมี 8 ช่อง): '+longId.map(function(e){return e.employee_id;}).join(', '));
  var warn=notes.length?('<div class="card no-print" style="border-color:rgba(255,159,67,.35);background:rgba(255,159,67,.07);margin-bottom:14px;width:100%">'+
    notes.map(function(n){return '<div style="display:flex;align-items:center;gap:10px;color:var(--amber);font-weight:600;font-size:13px">'+ic('warn',16)+esc(n)+'</div>';}).join('')+'</div>'):'';

  if(!TS_FONT_OK&&document.fonts&&document.fonts.load){TS_FONT_OK=true;tsFontsReady().then(function(){if(CUR==='card')drawCards();});}
  var built=tsBuild(picked.map(function(e){return tsOpts(e,from,to);}));
  area.innerHTML=warn+'<div class="tsprev" id="tsprev">'+built.html+'</div>';
  var cnt=$('cdcount');
  if(cnt)cnt.textContent+=' · '+built.cards+' ใบ · '+built.pages+' หน้า A4';
  tsFit();
}
// ใบจริงกว้าง 210mm (~794px) — จอแคบ/มือถือย่อด้วย zoom ให้พอดีกรอบ (ตอนพิมพ์ CSS รีเซ็ต zoom เป็น 1)
var TS_PAGE_PX=210*96/25.4,TS_FONT_OK=false;
function tsFit(){
  var box=$('tsprev');if(!box)return;
  var w=box.clientWidth||TS_PAGE_PX,z=Math.min(1,(w-2)/TS_PAGE_PX);
  var ps=box.querySelectorAll('.ts-page');
  for(var i=0;i<ps.length;i++)ps[i].style.zoom=z<1?String(Math.round(z*1000)/1000):'';
}
window.addEventListener('resize',function(){if(typeof CUR!=='undefined'&&CUR==='card')tsFit();});

/* ---- PDF ใบลงเวลา: วาดลงกล่องนอกจอ (ไม่ zoom) → html2canvas ทีละ .ts-page → jsPDF A4 แนวตั้งเต็มหน้า ---- */
function tsFontsReady(){
  if(!document.fonts||!document.fonts.load)return Promise.resolve();
  return Promise.all(['400','600','700','800'].map(function(w){return document.fonts.load(w+' 16px Sarabun');}))
    .then(function(){return document.fonts.ready;}).catch(function(){});
}
function tsPdfBlob(optsList,fname){
  tsInstallCss();
  return loadPdfLibs().then(tsFontsReady).then(function(){
    var built=tsBuild(optsList);
    var wrap=document.createElement('div');
    wrap.style.cssText='position:fixed;left:-99999px;top:0;width:210mm;background:#fff;z-index:-1';
    var pdf=new window.jspdf.jsPDF({orientation:'portrait',unit:'mm',format:'a4'});
    var pw=pdf.internal.pageSize.getWidth(),ph=pdf.internal.pageSize.getHeight();
    if(built.size==='full')return tsPdfFull(built,wrap,pdf,pw,fname);
    wrap.innerHTML=built.html;
    document.body.appendChild(wrap);
    var pages=[].slice.call(wrap.querySelectorAll('.ts-page'));
    var chain=Promise.resolve();
    pages.forEach(function(pg,i){
      chain=chain.then(function(){
        return html2canvas(pg,{scale:2,backgroundColor:'#ffffff',useCORS:true,logging:false}).then(function(canvas){
          if(i>0)pdf.addPage();
          // กว้างเต็ม A4 สูงตามสัดส่วนจริงของหน้า/ใบ (ใบเต็มหน้าที่แถวน้อยสูงไม่ถึง 297 มม. → วางชิดบน ห้ามยืด)
          var ih=Math.min(ph,pw*canvas.height/canvas.width);
          pdf.addImage(canvas.toDataURL('image/jpeg',0.9),'JPEG',0,0,pw,ih);
          if(pages.length>2)toast('สร้างใบลงเวลา '+(i+1)+'/'+pages.length+'…');
        });
      });
    });
    return chain.then(function(){
      document.body.removeChild(wrap);
      return {name:fname,pages:pages.length,base64:pdf.output('datauristring').split(',')[1]};
    }).catch(function(e){if(wrap.parentNode)document.body.removeChild(wrap);throw e;});
  });
}
/* PDF เต็มหน้า: จับภาพทีละใบที่ขนาดจริง (ไม่ผ่าน zoom — html2canvas วาด zoom ไม่ถูก) แล้ววางลงหน้า A4 ตาม plan
   ขนาด/ตำแหน่งตรงกับตัวอย่างบนจอและผลพิมพ์ (ย่อ s เท่ากัน จัดกลางแนวนอน ชิดบน คั่นด้วยเส้นประตัด) */
function tsPdfFull(built,wrap,pdf,pw,fname){
  wrap.innerHTML='<section class="ts-page ts-page-pack" style="height:auto;overflow:visible">'+built.cardHtml.join('')+TS_CUT_HTML+'</section>';
  document.body.appendChild(wrap);
  var els=[].slice.call(wrap.querySelectorAll('.ts-full')),cutEl=wrap.querySelector('.ts-cut');
  var opt={scale:2,backgroundColor:'#ffffff',useCORS:true,logging:false},shots=[],cutImg=null;
  var chain=html2canvas(cutEl,opt).then(function(c){cutImg={url:c.toDataURL('image/png'),ar:c.height/c.width,w:cutEl.getBoundingClientRect().width};});
  els.forEach(function(el,i){
    chain=chain.then(function(){return html2canvas(el,opt).then(function(c){
      shots[i]={url:c.toDataURL('image/jpeg',0.9),ar:c.height/c.width};
      if(els.length>2)toast('สร้างใบลงเวลา '+(i+1)+'/'+els.length+'…');
    });});
  });
  return chain.then(function(){
    var cutW=pw*cutImg.w/wrap.getBoundingClientRect().width,cutH=cutW*cutImg.ar;   // .ts-cut มี margin ข้าง 6 มม.
    built.plan.forEach(function(pg,pi){
      if(pi>0)pdf.addPage();
      var y=0,w=pw*pg.s,x=(pw-w)/2;
      pg.cards.forEach(function(ci,k){
        if(k>0){pdf.addImage(cutImg.url,'PNG',(pw-cutW)/2,y,cutW,cutH);y+=TS_CUT_MM;}
        var h=w*shots[ci].ar;
        pdf.addImage(shots[ci].url,'JPEG',x,y,w,h);y+=h;
      });
    });
    document.body.removeChild(wrap);
    return {name:fname,pages:built.plan.length,base64:pdf.output('datauristring').split(',')[1]};
  }).catch(function(e){if(wrap.parentNode)document.body.removeChild(wrap);throw e;});
}

/* ======================================================================
   ใบลงเวลาทำงาน — A4 แนวตั้ง  [พอร์ตจาก timesheet/timesheet-form.html]
   renderTimesheet({name, id, from, to, prefillDates, logo}) → HTML string ของแผ่น (.ts-page) — CSS อยู่ใน TS_CSS

   - from/to (yyyy-MM-dd)   = พิมพ์งวดไว้ที่หัวกระดาษ
   - prefillDates:true      = พิมพ์วันที่ของงวดลงทุกแถว พนักงานกรอกแค่เวลา
   - name / id              = พิมพ์ชื่อ/รหัสไว้ให้ (ตัวพิมพ์อ่านแม่นกว่าลายมือ)
   - logo                   = โลโก้หัวกระดาษ (STATE.logo = โลโก้ที่ผู้ใช้อัปโหลด (getLogo_ ใน Code.gs))
   - rows                   = จำนวนแถวต่อแผ่น 1–16 (ค่าเริ่มต้น 16) — ความสูงแถว/ช่องตัวเลขคงเดิม แถวน้อย = ตารางสั้นลง

   แผ่นละไม่เกิน 16 แถว (16 = 1 ปักษ์: 1–15 หรือ 16–สิ้นเดือน ได้ครบในแผ่นเดียว)
   งวดที่ยาวกว่าจำนวนแถว จะแตกเป็นหลายแผ่นอัตโนมัติ ตัดเมื่อครบจำนวนแถว และที่วันที่ 16 / วันที่ 1 ของเดือน
   เปิด prefillDates แต่แถวที่ตั้ง > วันในแผ่น → แถวที่เหลือเป็นช่องวันที่เปล่าให้เขียนเอง
   ออกแบบให้ AI อ่านลายมือ: ช่องตัวเลขแยกหลัก, ":" และ "/" พิมพ์ไว้แล้ว, เส้นดำล้วน, สี่เหลี่ยมดำ 4 มุมหน้าไว้ดัดภาพเอียง
   ท้ายกระดาษมีรหัส "PAY-TS" = ตัวแยกแบบฟอร์มของระบบนี้ (บอทใช้) ห้ามตัดทิ้ง/ห้ามเปลี่ยน
   ====================================================================== */
function tsCompany(){var st=STATE.settings||{};return [st.company_name,st.company_name_en].filter(Boolean).join(' · ');}
function renderTimesheet(opts){return tsPack(tsCards(opts),opts&&opts.size);}   // ใบของคน 1 คน → หน้า A4 (ใช้เมื่อเรียกเดี่ยว ๆ)
/* ใบของหลายคน → จัดลงหน้า A4 ต่อกัน (ครึ่งหน้า: ใบของคนถัดไปเติมช่องว่างครึ่งล่างต่อได้) → {html, cards, pages} */
var TS_CUT_HTML='<div class="ts-cut"><span>✂ ตัดตามเส้น</span></div>';
function tsBuild(optsList){
  var cards=[],size=(optsList[0]&&optsList[0].size)||'half';
  optsList.forEach(function(o){cards=cards.concat(tsCards(o));});
  if(size==='full'){   // เต็มหน้า: ใบใหญ่ เรียงต่อกันลงหน้า A4 (ลง 2 ใบได้ = 2 ใบ/หน้า) — plan ใช้ต่อใน PDF
    var plan=tsPackFull(cards);
    return {html:tsFullHtml(cards,plan),cards:cards.length,pages:plan.length,size:'full',plan:plan,cardHtml:cards};
  }
  var pages=tsPackHalf(cards);
  return {html:pages.map(function(pg){return '<section class="ts-page ts-page-half">'+pg.join(TS_CUT_HTML)+'</section>';}).join(''),
    cards:cards.length,pages:pages.length,size:'half'};
}
function tsPack(cards,size){
  if(size==='full')return tsFullHtml(cards,tsPackFull(cards));
  return tsPackHalf(cards).map(function(pg){return '<section class="ts-page ts-page-half">'+pg.join(TS_CUT_HTML)+'</section>';}).join('');
}
/* เต็มหน้า → หน้า A4: วัดความสูงจริงของทุกใบ แล้วใส่ใบถัดไปลงหน้าเดิมถ้าลงได้โดยย่อไม่ต่ำกว่า TS_FULL_MIN
   (ใบ 1–4 แถว ≈ 2 ใบ/หน้า · 5 แถว ย่อ ~85% · 6 แถวขึ้นไป = 1 ใบ/หน้า) · ทุกใบในหน้าเดียวกันใช้ขนาดเท่ากัน
   คืน [{cards:[index…], s:ขนาด 0–1, h:[ความสูงจริง มม.…]}] */
var TS_FULL_MIN=0.85;
function tsPackFull(cards){
  if(!cards.length)return [];
  tsInstallCss();
  var PXMM=96/25.4,box=document.createElement('div');
  box.style.cssText='position:fixed;left:-99999px;top:0;width:210mm;visibility:hidden;pointer-events:none';
  box.innerHTML='<section class="ts-page ts-page-pack" style="height:auto;overflow:visible">'+cards.join('')+'</section>';
  document.body.appendChild(box);
  var hs=[].slice.call(box.querySelectorAll('.ts-full')).map(function(e){return e.getBoundingClientRect().height/PXMM;});
  document.body.removeChild(box);
  var avail=TS_PAGE_MM-TS_FIT_SLACK_MM;
  function fit(n,sum){return Math.min(1,(avail-TS_CUT_MM*(n-1))/sum);}
  var pages=[],cur=null;
  cards.forEach(function(c,i){
    var h=hs[i]||296;
    if(cur){var sum=cur.sum+h,s=fit(cur.cards.length+1,sum);
      if(s>=TS_FULL_MIN){cur.cards.push(i);cur.h.push(h);cur.sum=sum;cur.s=s;return;}
      pages.push(cur);}
    cur={cards:[i],h:[h],sum:h,s:fit(1,h)};
  });
  if(cur)pages.push(cur);
  return pages;
}
function tsFullHtml(cards,plan){
  return plan.map(function(pg){
    var z=pg.s<0.999?' style="zoom:'+(Math.floor(pg.s*1000)/1000)+'"':'';
    return '<section class="ts-page ts-page-pack">'+pg.cards.map(function(i){return '<div class="ts-fz"'+z+'>'+cards[i]+'</div>';}).join(TS_CUT_HTML)+'</section>';
  }).join('');
}
/* ใบครึ่งหน้าสูง "ตามเนื้อหา" → วัดความสูงจริงของทุกใบ (กล่องวัดนอกจอ ใช้ CSS ชุดเดียวกับของจริง) แล้วเรียงลงหน้า A4
   ต่อกันจนเต็ม ใบถัดไปไม่พอที่ = ขึ้นหน้าใหม่ (ห้ามตัดใบข้ามหน้า) · ระหว่างใบมีเส้นประตัด (TS_CUT_MM)
   ใช้ผลเดียวกันทั้งตัวอย่างบนจอ ปุ่มพิมพ์ และ PDF → จำนวนหน้าตรงกันเสมอ */
var TS_PAGE_MM=297,TS_PAGE_PAD_MM=3,TS_CUT_MM=4,TS_FIT_SLACK_MM=0.8;
function tsPackHalf(cards){
  if(!cards.length)return [];
  tsInstallCss();
  var PXMM=96/25.4,box=document.createElement('div');
  box.style.cssText='position:fixed;left:-99999px;top:0;width:210mm;visibility:hidden;pointer-events:none';
  box.innerHTML='<section class="ts-page ts-page-half" style="height:auto;overflow:visible;padding:0">'+cards.join('')+'</section>';
  document.body.appendChild(box);
  var hs=[].slice.call(box.querySelectorAll('.ts-half')).map(function(e){return e.getBoundingClientRect().height/PXMM;});
  document.body.removeChild(box);
  var avail=TS_PAGE_MM-2*TS_PAGE_PAD_MM-TS_FIT_SLACK_MM,pages=[],cur=[],used=0;
  cards.forEach(function(c,i){
    var need=(cur.length?TS_CUT_MM:0)+(hs[i]||148);
    if(cur.length&&used+need>avail){pages.push(cur);cur=[];used=0;need=hs[i]||148;}
    cur.push(c);used+=need;
  });
  if(cur.length)pages.push(cur);
  return pages;
}
/* ใบลงเวลาของพนักงาน 1 คน → [HTML ของแต่ละใบ]
   opts.size 'half' (ค่าเริ่มต้น) = ใบกะทัดรัดกว้าง 210 มม. สูงตามเนื้อหา (16 แถว ≈ ครึ่ง A4) เรียงหลายใบต่อหน้า · 'full' = ใบเต็ม A4 (ดีไซน์ตาม mockup) 1 ใบ/หน้า
   ใบครึ่งหน้า: ≤8 แถว = ตารางคอลัมน์เดียว · 9–16 แถว = แบ่ง 2 บล็อกซ้าย-ขวา (ซ้ายเรียงก่อน แล้วต่อขวา)
   ทุกใบมีครบ: โลโก้+หัวเรื่อง · ชื่อ-สกุล · รหัส 8 ช่อง · งวด · ลายมือชื่อ · วิธีกรอก · ตาราง · ท้ายใบ "PAY-TS · ใบที่ x/y" · สี่เหลี่ยมดำ 4 มุมของใบ */
function tsCards(opts){
  opts=opts||{};
  var ROWS=Math.max(1,Math.min(16,parseInt(opts.rows,10)||16));
  var HALF=opts.size!=='full';
  var WD=['อา.','จ.','อ.','พ.','พฤ.','ศ.','ส.'];
  var TH_MON=['ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.'];
  var logo=opts.logo||'';
  var name=String(opts.name==null?'':opts.name).trim();
  var id=String(opts.id==null?'':opts.id).trim().toUpperCase();
  var from=isoToUtc(opts.from),to=isoToUtc(opts.to);
  var hasPeriod=!!(from&&to&&to>=from);
  var prefill=!!opts.prefillDates&&hasPeriod;

  function esc(v){return String(v==null?'':v).replace(/[&<>"']/g,function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
  function isoToUtc(s){var m=String(s||'').match(/^(\d{4})-(\d{2})-(\d{2})/);
    return m?Date.UTC(+m[1],+m[2]-1,+m[3]):null;}
  function p2(n){return (n<10?'0':'')+n;}
  function dd(t){return p2(new Date(t).getUTCDate());}
  function mm(t){return p2(new Date(t).getUTCMonth()+1);}
  function yyBE(t){return p2((new Date(t).getUTCFullYear()+543)%100);}
  function thaiShort(t){var d=new Date(t);return d.getUTCDate()+' '+TH_MON[d.getUTCMonth()]+' '+(d.getUTCFullYear()+543);}

  /* ---- แบ่งงวดเป็นใบ: ครบจำนวนแถว / วันที่ 16 / วันที่ 1 ของเดือน = ขึ้นใบใหม่ ---- */
  var DAY=86400000,chunks=[];
  if(hasPeriod){
    var days=[];for(var t=from;t<=to;t+=DAY)days.push(t);
    // ไม่พิมพ์วันที่ลงตาราง (พนักงานเขียนวันเอง) = 1 คน 1 ใบ ทั้งงวด ไม่แตกใบตามจำนวนแถว (ผู้ใช้ขอ 17 ก.ย. 69)
    if(days.length<=ROWS||!prefill){chunks.push(days);}
    else{
      var cur=[];
      days.forEach(function(t){
        var d=new Date(t).getUTCDate();
        if(cur.length&&(cur.length===ROWS||d===16||d===1)){chunks.push(cur);cur=[];}
        cur.push(t);
      });
      if(cur.length)chunks.push(cur);
    }
  }else chunks.push(null);

  /* ---- ชิ้นส่วน ---- */
  function boxes(chars,n,cls){           // ช่องแยกหลัก n ช่อง (พิมพ์ตัวอักษรลงได้)
    var h='<span class="ts-comb'+(cls?' '+cls:'')+'">';
    for(var i=0;i<n;i++)h+='<i>'+esc(chars&&chars.charAt(i)||'')+'</i>';
    return h+'</span>';
  }
  function dateComb(t){                  // วว / ดด / 25ปป (ปี พ.ศ.)

  }

  function timeCell(){return pair()+'<b class="ts-colon"></b>'+pair();}
  // ตาราง 4 คอลัมน์ (ข้อกำหนดผู้ใช้): วันที่ | เวลาเข้า | เวลาออก | รวม — ไม่มีคอลัมน์ลำดับ "ที่"
  // 15 ก.ย. 2569 ผู้ใช้ขอเพิ่ม "รวม" ให้การ์ดลงเวลา — ช่องรวมเขียนอิสระ (ไม่มีกล่องแยกหลัก)
  // มีไว้ให้พนักงาน/หัวหน้าเห็นยอดบนกระดาษเท่านั้น: AI ไม่อ่านช่องนี้ ระบบคำนวณชั่วโมงเองจากเวลาเข้า-ออก
  // slots = [วันที่ (ms) | null] · null + โหมดพิมพ์วันที่ = ช่องวันที่ว่างเปล่า · null + ไม่พิมพ์วันที่ = กล่อง วว/ดด ให้เขียน

      '<th>เวลาเข้า<small>ชั่วโมง : นาที</small></th><th>เวลาออก<small>ชั่วโมง : นาที</small></th><th>รวม<small>ชั่วโมง</small></th></tr></thead><tbody>';
    slots.forEach(function(t,r){
      var dateTd=t
        ?'<td class="ts-date ts-date-p"><span class="ts-wd">'+WD[new Date(t).getUTCDay()]+'</span><span class="ts-dp">'+dd(t)+'/'+mm(t)+'</span></td>'

                 :'<td class="ts-date">'+pair()+'<b class="ts-slash"></b>'+pair()+'</td>');
      h+='<tr data-row="'+(rowNo0+r+1)+'"'+(t?' data-date="'+new Date(t).toISOString().slice(0,10)+'"':'')+'>'+

    ?'<li>วันที่<b>พิมพ์ไว้แล้ว</b> กรอกเฉพาะเวลา</li>'
    :'<li>วันที่เขียน <b>วัน/เดือน</b> เช่น 3 ก.ย. = <b>03/09</b></li>';

  return chunks.map(function(chunk,pi){

    var slots=[];for(var r=0;r<ROWS;r++)slots.push((prefill&&chunk&&r<chunk.length)?chunk[r]:null);

      :'<div class="ts-grids ts-one">'+table(slots,0)+'</div>';

      '<i class="ts-fid ts-tl"></i><i class="ts-fid ts-tr"></i><i class="ts-fid ts-bl"></i><i class="ts-fid ts-br"></i>'+
      '<header class="ts-head">'+
        (logo?'<img class="ts-logo" src="'+esc(logo)+'" alt="'+esc(tsCompany())+'">':'<span></span>')+
        '<div class="ts-titles"><h1 class="ts-doc">ใบลงเวลาทำงาน</h1>'+
        (tsCompany()?'<div class="ts-co">'+esc(tsCompany())+'</div>':'')+'</div>'+
      '</header><div class="ts-rule"></div>'+
      '<div class="ts-info">'+
        '<div class="ts-f"><span class="ts-lab">ชื่อ-สกุล</span><span class="ts-namebox">'+esc(name)+'</span></div>'+
        '<div class="ts-f"><span class="ts-lab">รหัสพนักงาน</span>'+boxes(id,8)+
          '<span class="ts-sign"><span class="ts-lab2">ลายมือชื่อ</span><span class="ts-signline"></span></span></div>'+
        '<div class="ts-f"><span class="ts-lab">งวดวันที่</span>'+dateComb(pFrom)+'<b class="ts-to">ถึง</b>'+dateComb(pTo)+'</div>'+
      '</div>'+
      '<div class="ts-howto"><h2>วิธีกรอก</h2><ul>'+
        '<li>ปากกา<b>ดำหรือน้ำเงิน</b> ตัวเลข<b>ช่องละ 1 ตัว</b></li>'+
        howDate+
        '<li>เวลาแบบ <b>24 ชั่วโมง</b> 4 หลัก เช่น <b>08:05</b>, <b>17:30</b></li>'+
        '<li>วันที่ไม่ได้มาทำงาน <b>เว้นว่างทั้งแถว</b></li>'+
      '</ul></div>'+
      grids+
      '<footer class="ts-foot"><span class="ts-tip"><span>ส่งใบนี้: ถ่ายรูปบนพื้นเรียบ ให้เห็น<b>สี่เหลี่ยมดำครบ 4 มุม</b></span>'+
        '<span class="ts-meta">PAY-TS · ใบที่ '+(pi+1)+'/'+chunks.length+
        (hasPeriod&&chunks.length>1?' · งวดเต็ม '+esc(thaiShort(from))+' – '+esc(thaiShort(to)):'')+'</span></span>'+
      '<span class="ts-sign ts-sign-foot"><span class="ts-lab2">หัวหน้างานตรวจ</span><span class="ts-signline ts-short"></span></span></footer>';
    return HALF?'<div class="ts-half" data-card="'+(pi+1)+'">'+inner+'</div>'
               :'<div class="ts-full" data-card="'+(pi+1)+'">'+inner+'</div>';   // เต็มหน้า: ใบขนาดใหญ่ — tsPackFull จัดลงหน้า A4 (ได้ 2 ใบ/หน้าเมื่อพอดี)
  });
}

/* PDF ทะเบียนเงินได้ — จับภาพ .regdoc ที่ render บนหน้าเว็บ (สีตรงหน้าจอ 100%) แปลงเป็น A4 แนวนอน
   เหตุที่ไม่ใช้ getAs('application/pdf') ฝั่ง server: converter ของ Drive ไม่ render พื้นสีตารางเลย */
var PDFLIBS=null;
function loadPdfLibs(){
  if(PDFLIBS)return PDFLIBS;
  PDFLIBS=new Promise(function(res,rej){
    var n=0,ok=function(){if(++n===2)res();},bad=function(){PDFLIBS=null;rej(new Error('โหลดตัวสร้าง PDF ไม่ได้ — เช็คอินเทอร์เน็ต'));};
    [['https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js'],
     ['https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js']].forEach(function(u){
      var s=document.createElement('script');s.src=u[0];s.onload=ok;s.onerror=bad;document.head.appendChild(s);});
  });
  return PDFLIBS;
}
function regPdfBlob(){
  var doc=document.querySelector('#printArea .regdoc');
  if(!doc)return Promise.reject(new Error('กด “สร้างรายงาน” ให้ตารางขึ้นก่อนนะ'));
  return loadPdfLibs().then(function(){
    var wrap=document.createElement('div');
    wrap.style.cssText='position:fixed;left:-99999px;top:0;width:1400px;background:#fff;color:#161C2D;'+
      '--card:#FFFFFF;--card2:#FBFCFE;--raise:#F2F4F9;--line:rgba(17,24,45,.14);--line2:rgba(17,24,45,.08);'+
      '--ink:#161C2D;--muted:#5A6580;--faint:#8C97AE;--brandsoft:rgba(240,6,11,.10);--radius:14px;';
    wrap.appendChild(doc.cloneNode(true));
    document.body.appendChild(wrap);
    return html2canvas(wrap.firstChild,{scale:2,backgroundColor:'#ffffff',useCORS:true,logging:false}).then(function(canvas){
      document.body.removeChild(wrap);
      var pdf=new window.jspdf.jsPDF({orientation:'landscape',unit:'mm',format:'a4'});
      var m=8,pw=pdf.internal.pageSize.getWidth(),ph=pdf.internal.pageSize.getHeight();
      var iw=pw-m*2,pagePx=Math.floor((ph-m*2)*canvas.width/iw);
      for(var y=0,first=true;y<canvas.height;y+=pagePx,first=false){
        var sh=Math.min(pagePx,canvas.height-y);
        var c2=document.createElement('canvas');c2.width=canvas.width;c2.height=sh;
        c2.getContext('2d').drawImage(canvas,0,y,canvas.width,sh,0,0,canvas.width,sh);
        if(!first)pdf.addPage();
        pdf.addImage(c2.toDataURL('image/jpeg',0.92),'JPEG',m,m,iw,sh*iw/canvas.width); // JPEG ไฟล์เล็กกว่า PNG ~20 เท่า คมพอสำหรับตาราง
      }
      var p=payRepPeriod();
      return {name:'PayrollRegister_'+(p.from||'')+'_'+(p.to||'')+'.pdf',base64:pdf.output('datauristring').split(',')[1]};
    }).catch(function(e){if(wrap.parentNode)document.body.removeChild(wrap);throw e;});
  });
}

  regPdfBlob().then(function(r){
    dl(r.base64,r.name,'application/pdf');toast('ดาวน์โหลดแล้ว');
    run('apiSaveReportPdf',r.name,r.base64).catch(function(){}); // เก็บสำเนาเข้า Drive เงียบๆ
  }).catch(function(e){toast((e&&e.message)||'สร้าง PDF ไม่สำเร็จ',true);});}

function payFilterView(d){
  var dep=$('prd')?$('prd').value:'';var emp=$('pre')?$('pre').value:'';
  if(!dep&&!emp)return d;
  var groups=d.groups.map(function(g){return {department:g.department,
    rows:(dep&&g.department!==dep)?[]:g.rows.filter(function(r){return !emp||String(r.employee_id)===emp;})};})
    .filter(function(g){return g.rows.length;});
  var sum=function(rows){var t={hours:0,ot_hours:0,normal_pay:0,ot_pay:0,diligence:0,addition:0,bonus:0,gross:0,wht:0,deduction:0,net:0};
    rows.forEach(function(r){t.hours+=(Number(r.normal_hours)||0)+(Number(r.ot_hours)||0);t.ot_hours+=Number(r.ot_hours)||0;
      ['normal_pay','ot_pay','diligence','addition','bonus','gross','wht','deduction','net'].forEach(function(k){t[k]+=Number(r[k])||0;});});return t;};
  var all=[];groups.forEach(function(g){g.totals=sum(g.rows);all=all.concat(g.rows);});
  var ids={};all.forEach(function(r){ids[r.employee_id||r.employee_name]=1;});
  return {period:d.period,pay_date:d.pay_date,groups:groups,rows:all,totals:sum(all),headcount:Object.keys(ids).length};

      '<div style="display:flex;gap:20px;margin-top:12px;font-size:12.5px;color:var(--muted)"><span><span style="background:#F81E24;display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;vertical-align:0"></span>ค่าจ้างพื้นฐาน</span><span><span style="background:#FB923C;display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;vertical-align:0"></span>ค่าโอที</span></div></div>'+
      '<div class="card" style="display:flex;flex-direction:column"><h2 class="sec">โครงสร้างค่าใช้จ่าย</h2><div id="csDonut" style="display:flex;gap:22px;align-items:center;justify-content:center;flex-wrap:wrap;flex:1;margin-top:10px"></div></div></div>';
    $('csOut').innerHTML=cards+row;drawBars('csBars',d.trend||[]);drawDonut('csDonut',d.cost||[]);
  }).catch(err);}

/* ================= Access (สิทธิการใช้งาน) ================= */
function renderAccess(){run('apiActivityLog').then(function(log){
  var ok=0,er=0;log.forEach(function(r){if(r.status==='สำเร็จ')ok++;else er++;});
  var h='<div class="card"><h2 class="sec">'+si('inbox')+'ข้อมูลเข้าจากบอท LINE</h2>'+
    '<div class="muted" style="font-size:12.5px;margin-top:10px">ระบบทำงานแบบ Execute-as-owner — ข้อมูลทั้งหมดอยู่ใน Google Sheet ของเจ้าของเท่านั้น '+
    'และหน้าเว็บนี้ไม่มีรหัสผ่าน ใครมีลิงก์ก็เปิดได้ (แชร์ลิงก์เฉพาะคนในทีม)</div></div>';
  h+='<div class="stats" style="grid-template-columns:repeat(3,1fr);margin-top:18px">'+
    statCard('s-blue','inbox','ข้อมูลเข้าทั้งหมด',log.length+' ครั้ง','','','','')+
    statCard('s-green','check','สำเร็จ',ok+' ครั้ง','','','','')+
    statCard('s-orange','warn','ผิดพลาด',er+' ครั้ง','','','','')+'</div>';
  h+='<div class="card" style="margin-top:18px"><h2 class="sec">'+si('history')+'บันทึกกิจกรรม <span class="muted" style="font-weight:400;font-size:12px">(ข้อมูลเข้าจากบอท LINE)</span> <span class="pill" style="margin-left:auto">'+log.length+' รายการ</span></h2><div class="tablewrap" style="margin-top:10px">';
  if(!log.length)h+='<div class="empty">ยังไม่มีบันทึกกิจกรรม — เมื่อพนักงานส่งรูปผ่าน LINE จะปรากฏที่นี่</div>';
  else h+='<table><thead><tr><th>เวลา</th><th>ผู้ส่ง (LINE)</th><th>สถานะ</th><th>หมายเหตุ</th><th>ไฟล์</th></tr></thead><tbody>'+
    log.map(function(r){return '<tr><td class="muted" style="white-space:nowrap">'+esc(fmtTs(r.imported_at))+'</td><td>'+esc(r.display_name||r.line_user_id||'-')+'</td><td>'+logChip(r.status)+'</td><td class="muted">'+esc(r.note||'-')+'</td><td>'+(r.file_url?'<a style="color:var(--violetl)" href="'+esc(r.file_url)+'" target="_blank">ดู</a>':'-')+'</td></tr>';}).join('')+'</tbody></table>';
  setContent(h+'</div></div>');
}).catch(err);}
function fmtTs(s){if(!s)return '-';var d=String(s);return d.length>=16?d.slice(0,10)+' '+d.slice(11,16):d;}

/* ================= Settings ================= */
function renderSet(){var s=STATE.settings;
  function f(k,l,ph){return '<div class="field grow"><label>'+l+'</label><input id="s_'+k+'" value="'+esc(s[k]||'')+'" placeholder="'+(ph||'')+'"></div>';}
  setContent(logoCardHtml()+'<div class="card" style="margin-top:18px"><h2 class="sec">'+si('building')+'ข้อมูลบริษัท (ขึ้นบนสลิป)</h2><div class="toolbar" style="margin-top:14px">'+
    f('company_name','ชื่อบริษัท (ไทย)','บริษัท ตัวอย่าง จำกัด')+f('company_name_en','ชื่อบริษัท (อังกฤษ)','EXAMPLE CO., LTD.')+f('company_address','ที่อยู่')+f('tax_id','เลขประจำตัวผู้เสียภาษีอากร')+
    f('company_phone','โทรศัพท์','0x-xxx-xxxx')+f('company_email','อีเมล','name@company.co.th')+f('company_website','เว็บไซต์','www.company.co.th')+
    f('pay_date','วันที่จ่าย (YYYY-MM-DD)','เว้น=วันนี้')+f('slip_prefix','คำนำหน้าเลขสลิป','SLIP')+f('slip_note','หมายเหตุสลิป')+
    '</div><button class="btn primary" onclick="saveSet()">บันทึก</button>'+
    '<div class="muted" style="font-size:12px;margin-top:10px">ข้อมูลชุดนี้ขึ้นบนหัวสลิปเงินเดือนและรายงานทะเบียนเงินได้</div></div>'+
    '<div class="card" style="margin-top:18px"><h2 class="sec">'+si('calc')+'กติกาคำนวณ</h2><div class="toolbar" style="margin-top:14px">'+
    f('standard_day_hours','ชม.ปกติ/วัน','8')+f('ot_multiplier','ตัวคูณ OT','1.5')+f('default_break_minutes','เวลาพัก (นาที)','60')+
    f('ot_min_minutes','OT ขั้นต่ำ (นาที)','0')+
    '</div><div class="muted" style="font-size:12.5px;margin-top:10px">ทำเกิน "ชม.ปกติ/วัน" ไม่ถึง "OT ขั้นต่ำ" จะไม่ถูกนับเป็น OT (ใส่ 0 = นับทุกนาที) · ถ้ากรอกช่อง OT ในหน้าตรวจสอบเอง ระบบใช้ค่าที่กรอกเสมอ</div>'+
    '<button class="btn primary" onclick="saveSet()">บันทึก</button></div>'+
    '<div class="card" style="margin-top:18px"><h2 class="sec">'+si('receipt')+'ตัวนับสลิปบนแดชบอร์ด</h2>'+
    '<div class="muted" style="font-size:12.5px;margin:10px 0 14px">"สลิปที่ออกแล้ว" เป็นตัวนับสะสมทุกครั้งที่ออกสลิป — ล้างเพื่อเริ่มนับใหม่จาก 0 (ไม่กระทบไฟล์สลิปใน Drive)</div>'+
    '<button class="btn" onclick="resetSlipCount()">'+ic('trash',15)+' ล้างตัวนับสลิป</button></div>'+
    (FEATURE_TS_UPLOAD?'<div class="card" style="margin-top:18px"><h2 class="sec">'+si('camera')+'AI อ่านใบลงเวลา</h2>'+
    '<div class="muted" style="font-size:12.5px;margin:10px 0 14px">ลองเรียก AI จริง 1 ครั้ง เพื่อเช็คว่าคีย์ GEMINI_API_KEY ใน Script Properties ใช้งานได้ (ใส่คีย์ใหม่แล้วกดทดสอบได้ทันที)</div>'+
    '<button class="btn" id="aiTestBtn" onclick="testAiKey()">'+ic('spark',15)+' ทดสอบคีย์ AI</button>'+
    '<div id="aiTestOut" style="margin-top:12px;font-size:14px"></div></div>':'')+
    '<div class="card" style="margin-top:18px"><h2 class="sec">'+si('moon')+'การแสดงผล</h2>'+
    '<div class="muted" style="font-size:12.5px;margin:10px 0 14px">สลับโหมดสว่าง / มืด (จำไว้ในเครื่องนี้ · ค่าเริ่มต้น = โหมดมืด)</div>'+
    '<button class="btn" onclick="toggleTheme()">'+ic(currentTheme()==='light'?'moon':'sun',15)+' สลับเป็น'+(currentTheme()==='light'?'โหมดมืด':'โหมดสว่าง')+'</button></div>');}
function testAiKey(){var b=$('aiTestBtn'),o=$('aiTestOut');if(!b||!o)return;
  b.disabled=true;o.innerHTML='<span class="spin"></span> กำลังลองเรียก AI…';
  run('apiTsOcrReady',true).then(function(r){r=r||{};b.disabled=false;
    o.innerHTML=r.ok?'<span style="color:#2ecc71">✓ ใช้งานได้ · รุ่น '+esc(r.model||'')+'</span>':'<span style="color:#ff6b6b">✗ '+esc(r.error||'ใช้งานไม่ได้')+'</span>';
  }).catch(function(e){b.disabled=false;o.innerHTML='';err(e);});}
function saveSet(){var keys=['company_name','company_name_en','company_address','tax_id','company_phone','company_email','company_website','pay_date','slip_prefix','slip_note','standard_day_hours','ot_multiplier','default_break_minutes','ot_min_minutes'];
  var obj={};keys.forEach(function(k){var e=$('s_'+k);if(e)obj[k]=e.value;});
  run('apiSaveSettings',obj).then(function(){STATE.settings=Object.assign(STATE.settings,obj);toast('บันทึกแล้ว');init2(obj);}).catch(err);}
/* ---- โลโก้บริษัท: ผู้ใช้อัปโหลดเอง → ย่อในเบราว์เซอร์ (ด้านยาว ≤ 600px) → apiSaveLogo เก็บใน Drive ---- */
function logoCardHtml(){
  var has=!!STATE.logo;
  return '<div class="card"><h2 class="sec">'+si('image')+'โลโก้บริษัท</h2>'+
    '<div style="display:flex;align-items:center;gap:20px;flex-wrap:wrap;margin-top:14px">'+
      '<div style="width:220px;height:110px;border-radius:14px;background:#fff;border:1px dashed rgba(148,160,188,.45);display:flex;align-items:center;justify-content:center;overflow:hidden">'+
        (has?'<img src="'+esc(STATE.logo)+'" alt="โลโก้บริษัท" style="max-width:92%;max-height:92%;object-fit:contain">':'<span style="color:#8a93a8;font-size:16px">ยังไม่มีโลโก้</span>')+
      '</div>'+
      '<div style="display:flex;flex-direction:column;gap:10px">'+
        '<input type="file" id="logoFile" accept="image/png,image/jpeg,image/webp" style="display:none" onchange="onLogoFile(this)">'+
        '<button class="btn primary" onclick="$(\'logoFile\').click()">'+ic('image',15)+' '+(has?'เปลี่ยนโลโก้':'อัปโหลดโลโก้')+'</button>'+
        (has?'<button class="btn" onclick="removeLogo()">'+ic('trash',15)+' ลบโลโก้</button>':'')+
      '</div>'+
    '</div>'+
    '<div class="muted" style="font-size:13px;margin-top:12px">รูป PNG / JPG / WEBP · แนะนำพื้นหลังโปร่งใสหรือพื้นขาว · โลโก้ขึ้นบนแถบเมนู สลิปเงินเดือน ใบลงเวลา และทะเบียนเงินได้</div></div>';
}
function onLogoFile(inp){
  var f=inp.files&&inp.files[0];inp.value='';
  if(!f)return;
  if(!/^image\/(png|jpeg|webp)$/.test(f.type)){toast('รองรับเฉพาะรูป PNG / JPG / WEBP',true);return;}
  var fr=new FileReader();
  fr.onerror=function(){toast('อ่านไฟล์รูปไม่ได้',true);};
  fr.onload=function(){
    var img=new Image();
    img.onerror=function(){toast('เปิดรูปนี้ไม่ได้ ลองไฟล์อื่น',true);};
    img.onload=function(){
      var max=600,w=img.naturalWidth,h=img.naturalHeight,k=Math.min(1,max/Math.max(w,h));
      var cv=document.createElement('canvas');cv.width=Math.max(1,Math.round(w*k));cv.height=Math.max(1,Math.round(h*k));
      cv.getContext('2d').drawImage(img,0,0,cv.width,cv.height);
      var uri=cv.toDataURL('image/png');                                   // PNG คงพื้นโปร่งใส
      if(uri.length>900000){var c2=document.createElement('canvas');c2.width=cv.width;c2.height=cv.height;
        var x=c2.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c2.width,c2.height);x.drawImage(cv,0,0);uri=c2.toDataURL('image/jpeg',0.9);}
      toast('กำลังบันทึกโลโก้…');
      run('apiSaveLogo',uri).then(function(r){
        if(!r||!r.ok){toast((r&&r.error)||'บันทึกโลโก้ไม่สำเร็จ',true);return;}
        STATE.logo=r.logo||uri;applyBrandLogo(STATE.logo);setCompany(STATE.settings.company_name);
        if(CUR==='set')renderSet();toast('บันทึกโลโก้แล้ว');
      }).catch(err);
    };
    img.src=fr.result;
  };
  fr.readAsDataURL(f);
}
function removeLogo(){
  askConfirm({title:'ลบโลโก้บริษัท',danger:true,icon:'trash',okLabel:'ลบโลโก้',
    msg:'โลโก้จะหายจากแถบเมนู สลิป ใบลงเวลา และรายงาน<br>อัปโหลดใหม่ได้ทุกเมื่อ',
    onOk:function(){run('apiRemoveLogo').then(function(){STATE.logo='';applyBrandLogo('');setCompany(STATE.settings.company_name);
      if(CUR==='set')renderSet();toast('ลบโลโก้แล้ว');}).catch(err);}});
}
function init2(o){setCompany(o.company_name);}
/* modal ยืนยันสไตล์เดียวกับแอป (แทน confirm() ของเบราว์เซอร์) — ใช้ซ้ำได้ทุกงานที่ต้องถามก่อนทำ */
function askConfirm(o){
  openModal('<h2 style="display:flex;align-items:center;gap:9px"><span style="color:'+(o.danger?'#e5484d':'var(--brand)')+'">'+ic(o.icon||'warn',19)+'</span>'+esc(o.title||'ยืนยันการทำรายการ')+'</h2>'+
    '<div class="muted" style="font-size:13.5px;line-height:1.9;margin:2px 0 18px">'+(o.msg||'')+'</div>'+
    '<div class="actions"><button class="btn ghost" onclick="closeModal()">ยกเลิก</button>'+
    '<button class="btn primary" id="cfmOk"'+(o.danger?' style="background:#C0392B;box-shadow:0 10px 24px rgba(192,57,43,.35)"':'')+'>'+esc(o.okLabel||'ยืนยัน')+'</button></div>');
  $('cfmOk').onclick=function(){closeModal();if(o.onOk)o.onOk();};
}
function resetSlipCount(){
  askConfirm({title:'ล้างตัวนับสลิป',danger:true,icon:'trash',okLabel:'ล้างตัวนับ',
    msg:'ตัวเลข “สลิปที่ออกแล้ว” บนแดชบอร์ดจะเริ่มนับใหม่จาก <b>0</b><br>ไฟล์สลิปใน Drive (05_Payslips) <b>ไม่ถูกลบ</b> ยังเปิดดูได้ตามเดิม',
    onOk:function(){run('apiResetSlipCount').then(function(){toast('ล้างตัวนับแล้ว — แดชบอร์ดจะแสดง 0');}).catch(err);}});
}

boot();
</script>
